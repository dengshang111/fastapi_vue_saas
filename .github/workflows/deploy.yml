name: CI/CD Deploy (Single ECS)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            PROJECT_ROOT="/opt/fastapi_vue_saas"
            
            echo "🚀 [1/5] 开始拉取最新代码..."
            cd $PROJECT_ROOT
            git pull
            
            echo "🛑 [2/5] 清理环境与端口检查..."
            # 强制停止宿主机 Nginx 防止端口冲突
            sudo systemctl stop nginx || true
            cd $PROJECT_ROOT/deploy
            docker compose down
            
            echo "🏗️ [3/5] 构建 Web 管理后台 (Vite 7)..."
            cd $PROJECT_ROOT/backend_admin/web
            # 这里使用本地 node 环境构建，或在 Dockerfile 中指定 node:22
            npm install
            npm run build
            
            echo "📱 [4/5] 构建 uni-app 小程序 H5 端..."
            cd $PROJECT_ROOT/uniapp
            npm install
            # 编译为 H5 平台静态资源
            npm run build:h5
            
            echo "🚢 [5/5] 启动 Docker 容器..."
            cd $PROJECT_ROOT/deploy
            docker compose up -d --build
            
            echo "✅ 部署完成！"
            echo "管理后台: http://IP/admin"
            echo "移动端预览: http://IP/mobile"
            echo "后端接口: http://IP/backend"
