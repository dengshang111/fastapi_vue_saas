version: "3.8"

services:
  backend:
    build:
      context: /opt/fastapi_vue_saas/backend_admin/api
    container_name: fastapi_backend
    restart: always
    depends_on:
      - mysql
      - redis
    expose:
      - "8000"

  admin_web:
    build:
      context: /opt/fastapi_vue_saas # 将 context 移到根目录，方便读取构建产物
      dockerfile: ./backend_admin/web/Dockerfile # 建议在 web 下创建 Dockerfile
    container_name: admin_web
    restart: always
    ports:
      - "80:80"
    volumes:
      # 挂载自定义 Nginx 配置
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 挂载管理后台静态文件
      - /opt/fastapi_vue_saas/backend_admin/web/dist:/usr/share/nginx/html/admin:ro
      # 挂载 uniapp H5 静态文件 (新增)
      - /opt/fastapi_vue_saas/uniapp/dist/build/h5:/usr/share/nginx/html/mobile:ro
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: saas_db
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: redis
    restart: always

volumes:
  mysql_data: