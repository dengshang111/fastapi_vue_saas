version: "3.8"

services:
  backend:
    build:
      context: /opt/fastapi_vue_saas/backend_admin/api
    container_name: fastapi_backend
    restart: always
#    env_file:
#      - /opt/fastapi_vue_saas/deploy/.env
    depends_on:
      - mysql
      - redis
    expose:
      - "8000"

  admin_web:
    build:
      context: /opt/fastapi_vue_saas/backend_admin/web
    container_name: admin_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: saas_db
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: saas_pass
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: redis
    restart: always

volumes:
  mysql_data:
